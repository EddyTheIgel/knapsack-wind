<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knapsack Wind</title>

<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  height:100vh;
}

#compass{
  width:300px;
  height:300px;
  border:4px solid white;
  border-radius:50%;
  position:relative;
}

#arrow{
  position:absolute;
  width:6px;
  height:120px;
  background:red;
  left:50%;
  top:50%;
  transform-origin:bottom center;
}

.label{
  position:absolute;
  font-size:28px;
  font-weight:bold;
}

.n{top:10px;left:50%;transform:translateX(-50%);}
.s{bottom:10px;left:50%;transform:translateX(-50%);}
.w{left:10px;top:50%;transform:translateY(-50%);}
.e{right:10px;top:50%;transform:translateY(-50%);}

#value{
  margin-top:25px;
  font-size:24px;
}
</style>
</head>

<body>

<div id="compass">
  <div class="label n">N</div>
  <div class="label e">E</div>
  <div class="label s">S</div>
  <div class="label w">W</div>
  <div id="arrow"></div>
</div>

<div id="value">268°</div>

<script>
const degree = 268;

document.getElementById("arrow").style.transform =
`translate(-50%,-100%) rotate(${degree}deg)`;

document.getElementById("value").innerText =
degree + "°";
</script>

</body>
</html>
