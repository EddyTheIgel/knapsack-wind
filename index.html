<script>

let currentStation = "knapsack";

function switchStation(station){

    currentStation = station;

    const btnKnapsack =
        document.getElementById("btnKnapsack");

    const btnHermuelheim =
        document.getElementById("btnHermuelheim");

    btnKnapsack.classList.remove("active");
    btnHermuelheim.classList.remove("active");

    if(station === "knapsack"){

        document.getElementById("stationTitle").innerText =
            "Messstation Chemiepark Knapsack";

        btnKnapsack.classList.add("active");

    } else {

        document.getElementById("stationTitle").innerText =
            "Messstation Hermülheim Feuerwehr";

        btnHermuelheim.classList.add("active");
    }

    loadWind();
}

async function loadWind(){

    try{

        let apiUrl;

        if(currentStation === "knapsack"){
            apiUrl =
                "https://little-night-a9ab.knapsack-tools.workers.dev/";
        } else {
            apiUrl =
                "https://hermuelheim-wind.knapsack-tools.workers.dev/";
        }

        console.log("API URL:", apiUrl);

        const response = await fetch(apiUrl);

        if(!response.ok){
            throw new Error("HTTP Fehler: " + response.status);
        }

        const data = await response.json();

        console.log("API Daten:", data);

        const degree = Number(data.direction);
        const speed = Number(data.speed);

        const rotation = degree - 90;

        document.getElementById("arrow").style.transform =
            `translateY(-50%) rotate(${rotation}deg)`;

        document.getElementById("info").innerText =
            `Wind kommt aus: ${degree}° | ${speed} m/s`;

    }
    catch(error){

        document.getElementById("info").innerText =
            "Fehler beim Laden der Wetterdaten";

        console.error(error);
    }
}

loadWind();
setInterval(loadWind, 60000);

</script>
