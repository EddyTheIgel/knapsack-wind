<script>

async function updateWind() {
  try {
    const response = await fetch(
      "https://little-night-a9ab.winkelmesser.workers.dev/"
    );

    const data = await response.json();

    const degree = data.direction;
    const speed = data.speed;

    // CSS verwendet 0° = Osten
    // Wetterdaten verwenden 0° = Norden
    const rotation = degree - 90;

    document.getElementById("arrow").style.transform =
      `rotate(${rotation}deg)`;

    document.getElementById("info").innerText =
      `Wind kommt aus: ${degree}° | ${speed} m/s`;

  } catch (error) {
    document.getElementById("info").innerText =
      "Fehler beim Laden der Wetterdaten";
    console.error(error);
  }
}

updateWind();
setInterval(updateWind, 60000);

</script>
