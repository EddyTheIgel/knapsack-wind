<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knapsack Wind</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#compass{
    position:relative;
    width:320px;
    height:320px;
    border:4px solid white;
    border-radius:50%;
}

.label{
    position:absolute;
    font-size:32px;
    font-weight:bold;
}

.n{top:10px;left:50%;transform:translateX(-50%);}
.e{right:10px;top:50%;transform:translateY(-50%);}
.s{bottom:10px;left:50%;transform:translateX(-50%);}
.w{left:10px;top:50%;transform:translateY(-50%);}

#needle{
    position:absolute;
    left:50%;
    top:50%;
    width:0;
    height:0;
    transform-origin:center center;
}

#needle::before{
    content:"";
    position:absolute;
    width:8px;
    height:110px;
    background:red;
    left:-4px;
    top:-110px;
}

#needle::after{
    content:"";
    position:absolute;
    left:-12px;
    top:-135px;
    border-left:12px solid transparent;
    border-right:12px solid transparent;
    border-bottom:25px solid red;
}

#center{
    position:absolute;
    width:18px;
    height:18px;
    background:white;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

#value{
    margin-top:30px;
    font-size:48px;
}
</style>
</head>
<body>

<div id="compass">

    <div class="label n">N</div>
    <div class="label e">E</div>
    <div class="label s">S</div>
    <div class="label w">W</div>

    <div id="needle"></div>
    <div id="center"></div>

</div>

<div id="value">220°</div>

<script>

const degree = 220;

document.getElementById("needle").style.transform =
`rotate(${degree}deg)`;

document.getElementById("value").innerText =
degree + "°";

</script>

</body>
</html>
