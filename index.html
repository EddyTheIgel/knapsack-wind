<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Winddaten Hürth</title>

<style>

body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    text-align:center;
    padding:20px;
}

h1{
    font-size:36px;
    margin-bottom:25px;
}

#buttons{
    margin-bottom:25px;
}

#buttons button{
    font-size:20px;
    padding:12px 22px;
    margin:0 8px;
    cursor:pointer;
    border:none;
    border-radius:10px;
    background:#333;
    color:white;
    transition:0.2s;
}

#buttons button:hover{
    background:#555;
}

#buttons button.active{
    background:#0078ff;
}

#compass{
    width:320px;
    height:320px;
    border:6px solid white;
    border-radius:50%;
    position:relative;
    margin:auto;
}

.direction{
    position:absolute;
    font-size:48px;
    font-weight:bold;
}

.n{
    top:15px;
    left:50%;
    transform:translateX(-50%);
}

.s{
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
}

.w{
    left:15px;
    top:50%;
    transform:translateY(-50%);
}

.e{
    right:15px;
    top:50%;
    transform:translateY(-50%);
}

#arrow{
    position:absolute;
    top:50%;
    left:50%;
    width:140px;
    height:10px;
    background:red;

    transform-origin:0% 50%;
    transform:translateY(-50%);
}

#arrow::after{
    content:"";
    position:absolute;
    right:-18px;
    top:-10px;
    border-left:25px solid red;
    border-top:15px solid transparent;
    border-bottom:15px solid transparent;
}

#center{
    position:absolute;
    width:18px;
    height:18px;
    background:white;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

#info{
    margin-top:35px;
    font-size:30px;
}

</style>
</head>

<body>

<div class="container">

    <h1 id="stationTitle">
        Messstation Chemiepark Knapsack
    </h1>

    <div id="buttons">

        <button
            id="btnKnapsack"
            class="active"
            onclick="switchStation('knapsack')">
            Chemiepark
        </button>

        <button
            id="btnHermuelheim"
            onclick="switchStation('hermuelheim')">
            Hermülheim
        </button>

    </div>

    <div id="compass">

        <div class="direction n">N</div>
        <div class="direction e">E</div>
        <div class="direction s">S</div>
        <div class="direction w">W</div>

        <div id="arrow"></div>
        <div id="center"></div>

    </div>

    <div id="info">
        Lade Wetterdaten...
    </div>

</div>

<script>

let currentStation = "knapsack";

function switchStation(station){

    currentStation = station;

    document
        .getElementById("btnKnapsack")
        .classList.remove("active");

    document
        .getElementById("btnHermuelheim")
        .classList.remove("active");

    if(station === "knapsack"){

        document.getElementById("stationTitle").innerText =
            "Messstation Chemiepark Knapsack";

        document
            .getElementById("btnKnapsack")
            .classList.add("active");

    }else{

        document.getElementById("stationTitle").innerText =
            "Messstation Hermülheim Feuer- und Rettungswache";

        document
            .getElementById("btnHermuelheim")
            .classList.add("active");
    }

    loadWind();
}

async function loadWind(){

    try{

        let apiUrl;

        if(currentStation === "knapsack"){

            apiUrl =
            "https://little-night-a9ab.knapsack-tools.workers.dev/";

        }else{

            apiUrl =
            "https://hermuelheim-wind.knapsack-tools.workers.dev/";
        }

        const response = await fetch(apiUrl);

        if(!response.ok){
            throw new Error(
                "HTTP Fehler " + response.status
            );
        }

        const data = await response.json();

        const degree = Number(data.direction);
        const speed = Number(data.speed);

        const rotation = degree - 90;

        document.getElementById("arrow").style.transform =
            `translateY(-50%) rotate(${rotation}deg)`;

        document.getElementById("info").innerText =
            `Wind kommt aus: ${degree}° | ${speed} m/s`;

    }
    catch(error){

        console.error(error);

        document.getElementById("info").innerText =
            error.toString();
    }
}

loadWind();
setInterval(loadWind, 60000);

</script>

</body>
</html>
