<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Winddaten Hürth</title>

<style>

body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    text-align:center;
    max-width:700px;
    margin:auto;
    padding:60px 15px 50px 15px;
}

h1{
    font-size:28px;
    line-height:1.1;
    margin:0 0 30px 0;
    font-weight:bold;
}

#buttons{
    margin-bottom:40px;
}

#buttons button{
    font-size:22px;
    padding:14px 28px;
    margin:0 10px;
    cursor:pointer;
    border:none;
    border-radius:12px;
    background:#333;
    color:white;
    transition:0.2s;
}

#buttons button.active{
    background:#0078ff;
}

#compass{
    width:360px;
    height:360px;
    border:6px solid white;
    border-radius:50%;
    position:relative;
    margin:0 auto;
}

.direction{
    position:absolute;
    font-size:60px;
    font-weight:bold;
}

.n{
    top:18px;
    left:50%;
    transform:translateX(-50%);
}

.s{
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
}

.w{
    left:18px;
    top:50%;
    transform:translateY(-50%);
}

.e{
    right:18px;
    top:50%;
    transform:translateY(-50%);
}

#arrow{
    position:absolute;
    top:50%;
    left:50%;
    width:160px;
    height:12px;
    background:red;
    transform-origin:0% 50%;
    transform:translateY(-50%);
}

#arrow::after{
    content:"";
    position:absolute;
    right:-20px;
    top:-12px;
    border-left:28px solid red;
    border-top:18px solid transparent;
    border-bottom:18px solid transparent;
}

#center{
    position:absolute;
    width:22px;
    height:22px;
    background:white;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

#info{
    margin-top:40px;
    font-size:32px;
    line-height:1.25;
}

@media (max-width:600px){

    .container{
        padding-top:80px;
    }

    h1{
        font-size:26px;
    }

    #buttons button{
        font-size:18px;
        padding:14px 22px;
    }

    #compass{
        width:300px;
        height:300px;
    }

    .direction{
        font-size:52px;
    }

    #arrow{
        width:135px;
    }

    #info{
        font-size:26px;
    }
}

</style>
</head>

<body>

<div class="container">

<h1>Winddaten Hürth</h1>

<div id="buttons">

<button
id="btnKnapsack"
class="active"
onclick="switchStation('knapsack')">
Chemiepark
</button>

<button
id="btnHermuelheim"
onclick="switchStation('hermuelheim')">
Feuerwehr
</button>

</div>

<div id="compass">

<div class="direction n">N</div>
<div class="direction e">E</div>
<div class="direction s">S</div>
<div class="direction w">W</div>

<div id="arrow"></div>
<div id="center"></div>

</div>

<div id="info">
Lade Wetterdaten...
</div>

</div>

<script>

let currentStation = "knapsack";

function switchStation(station){

    currentStation = station;

    document.getElementById("btnKnapsack")
        .classList.remove("active");

    document.getElementById("btnHermuelheim")
        .classList.remove("active");

    if(station === "knapsack"){

        document.getElementById("btnKnapsack")
            .classList.add("active");

    }else{

        document.getElementById("btnHermuelheim")
            .classList.add("active");
    }

    loadWind();
}

async function loadWind(){

    try{

        let apiUrl;

        if(currentStation === "knapsack"){

            apiUrl =
            "https://little-night-a9ab.knapsack-tools.workers.dev/";

        }else{

            apiUrl =
            "https://hermuelheim-wind.knapsack-tools.workers.dev/";
        }

        const response = await fetch(apiUrl);
        const data = await response.json();

        const degree = Number(data.direction);
        const speed = Number(data.speed);

        document.getElementById("arrow").style.transform =
        `translateY(-50%) rotate(${degree-90}deg)`;

        document.getElementById("info").innerHTML =
        `Wind kommt aus: ${degree}°<br>${speed} m/s`;

    }
    catch(error){

        document.getElementById("info").innerText =
        "Fehler beim Laden der Daten";
    }
}

switchStation("knapsack");

setInterval(loadWind,60000);

</script>

</body>
</html>
